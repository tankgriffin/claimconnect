    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much does it cost to use ClaimConnect?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ClaimConnect is completely free to use. There are no upfront costs or fees to submit your claim assessment. The lawyers in our network work on a 'No Win, No Fee' basis, meaning you only pay if your case is successful. This removes all financial risk from you."
          }
        },
        {
          "@type": "Question",
          "name": "How long does the claims process take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The timeline varies depending on your case complexity. Simple claims can be resolved in 6-12 months, while more complex cases may take 18-24 months. We'll match you with a lawyer who will provide a realistic timeline during your free consultation. Most clients see significant progress within the first few months."
          }
        },
        {
          "@type": "Question",
          "name": "What types of injury claims do you handle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We connect you with lawyers specializing in all types of personal injury claims including: Motor Vehicle Accidents, Workplace Injuries, Medical Malpractice, Slip & Fall Accidents, Product Liability, Public Liability, Workers' Compensation, and Assault Claims. Our network covers all Australian states and territories."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to have medical evidence to start a claim?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "While medical evidence strengthens your claim, you don't need it to start the process. If you've sought medical attention, bring any documentation to your consultation. If you haven't seen a doctor yet, your lawyer can advise you on the next steps. Early consultation is important to preserve your rights."
          }
        },
        {
          "@type": "Question",
          "name": "What is 'No Win, No Fee' and how does it work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "'No Win, No Fee' means you don't pay any legal fees unless your claim is successful. If you win, your lawyer's fees are typically paid as a percentage of your compensation (usually capped by law). If you don't win, you don't pay legal fees. This arrangement makes legal representation accessible to everyone."
          }
        },
        {
          "@type": "Question",
          "name": "How quickly will I be contacted after submitting my assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We aim to connect you with a qualified lawyer within 1 hour of submitting your assessment. You'll receive a call or text to schedule your free consultation. During this consultation, a lawyer will review your case details and advise on the best path forward."
          }
        },
        {
          "@type": "Question",
          "name": "Can I still make a claim if the incident happened a while ago?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, but time limits apply. In most Australian states, you have 3 years from the date of injury to start a claim. However, some cases have shorter or longer time limits. It's crucial to act quickly - contact us today for a free assessment to understand your specific time limits."
          }
        },
        {
          "@type": "Question",
          "name": "What information do I need to provide for my assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our 90-second assessment asks basic questions about your injury type, when it occurred, medical attention received, and your contact details. You don't need extensive documentation at this stage - just enough information for us to match you with the right lawyer. Detailed evidence can be gathered later."
          }
        }
      ]
    }
